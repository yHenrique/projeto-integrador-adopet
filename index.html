<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!--https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css-->
</head>

<body>
    <img src="logo.png">
    <div class="cadastro-card">
        <h2>Cadastrar Novo Pet</h2>
        <form>
            <div>
                <div>
                    <label>Nome:</label>
                    <input type="text" id="nome" required>
                </div>
                <div>
                    <label>Idade:</label>
                    <input type="number" id="idade" min="0" max="20" required>
                </div>
                <div>
                    <label for="especies">Espécie:</label>
                    <select id="especie" name="especies">
                        <option value=""></option>
                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                    </select>
                </div>
                <div>
                    <label for="portes">Porte:</label>
                    <select id="porte" name="portes">
                        <option value=""></option>
                        <option value="Pequeno">Pequeno</option>
                        <option value="Médio">Médio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
                <div>
                    <label for="vacinas">Vacinado?</label>
                    <select id="vacina" name="vacinas">
                        <option value=""></option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label>Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>
                <div>
                    <label for="input-file">Adicionar foto:</label>
                    <input type="file" accept="image/jpeg, image/png, image/jpg" id="input-file" required>
                </div>
            </div>
            <button onclick="cadastrarPet()"><i class="fa fa-plus"></i>Incluir Pet</button>
        </form>
    </div>

    <div class="pet-card">
        <h2>Pets Adicionados</h2>
        <ul id="listaAnimais"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
