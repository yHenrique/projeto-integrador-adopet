<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adopet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <img class="logo" src="logo.png">
    
    <div class="usuario-card">
        <h2>Cadastro de Usuário</h2>

        <form id="formulario-usuario">

            <div>
                <label for="usuario-nome">Nome completo:</label>
                <input type="text" id="usuario-nome"
                    name="nome" required>
            </div>

            <div>
                <label for="usuario-email">E-mail:</label>
                <input type="email" id="usuario-email"
                    name="email" required>
            </div>

            <div>
                <label for="usuario-telefone">Telefone:</label>
                <input type="tel" id="usuario-telefone"
                    name="telefone" required>
            </div>

            <div>
                <label for="usuario-senha">Senha:</label>
                <input type="password" id="usuario-senha"
                    name="senha" required minlength="6">
            </div>

            <button type="submit">
                Cadastrar Usuário
            </button>

        </form>
    </div>

    <div class="cadastro-card">
        <h2>Cadastrar Novo Pet</h2>
        <form>
            <div>
                <div>
                    <label>Nome:</label>
                    <input type="text" id="nome" required>
                </div>
                <div>
                    <label>Idade:</label>
                    <input type="number" id="idade" min="1" max="20" required>
                </div>
                <div>
                    <label>Espécie:</label>
                    <select id="especie" name="especies" required>
                        <option value=""></option>
                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                    </select>
                </div>
                <div>
                    <label>Porte:</label>
                    <select id="porte" name="portes" required>
                        <option value=""></option>
                        <option value="Pequeno">Pequeno</option>
                        <option value="Médio">Médio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
                <div>
                    <label>Vacinado?</label>
                    <select id="vacina" name="vacinas" required>
                        <option value=""></option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label>Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>
                <div>
                    <label>Adicionar foto:</label>
                    <input type="file" accept="image/jpeg, image/png, image/jpg" id="input-file" required>
                </div>
            </div>
            <button onclick="cadastrarPet()"><i class="fa fa-plus"></i>Incluir Pet</button>
        </form>
    </div>

    <div class="pet-card">
        <h2>Pets Cadastrados</h2>
        <ul id="listaAnimais"></ul>
    </div>

    <dialog id="detalhes-pet" class="modal-pet">
        <button type="button" id="fechar-detalhes"><i class="fa fa-x"></i>
            Fechar
        </button>

        <div id="conteudo-detalhes"></div>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
