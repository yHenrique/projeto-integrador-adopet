<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <h1>ADOPET</h1>
    <div class="cadastro-card">
        <h2>Cadastrar Novo Pet</h2>
        <div>
            <div>
                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Informe o nome">
            </div>
            <div>
                <label>Espécie:</label>
                <input list="especies" id="especie" placeholder="Selecione a espécie">
                <datalist id="especies">
                    <option value="Cachorro">
                    <option value="Gato">
                </datalist>
            </div>
            <div>
                <label>Idade:</label>
                <input type="number" id="idade" placeholder="Informe a idade" min="0">
            </div>
            <div>
                <label>Porte:</label>
                <input list="portes" id="porte" placeholder="Selecione o porte">
                <datalist id="portes">
                    <option value="Pequeno">
                    <option value="Médio">
                    <option value="Grande">
                </datalist>
            </div>
        </div>
        <div>
            <div>
                <label>Vacinas:</label>
                <label for="vacinado"><input type="checkbox" id="vacina">Vacinado(a)</label>
                <!-- <label for="vermifugado"><input type="checkbox" id="vacina">Vermifugado(a)</label> -->
            </div>
            <div>
                <label>Descrição:</label>
                <input type="text" id="descricao" placeholder="Conte um pouco sobre o animal...">
            </div>
            <div>
                <label for="input-file">Foto:</label>
                <input type="file" accept="image/jpeg, image/png, image/jpg" id="input-file">
            </div>
        </div>
        <button onclick="cadastrarPet()"><i class="fa fa-plus"></i>Incluir Pet</button>
    </div>

    <div class="pet-card">
        <h2>Pets Adicionados</h2>
        <ul id="listaAnimais"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
